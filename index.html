<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>MONARCH</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* MONARCH Mini App: тёмный фон, тонкая линия, Manrope, один золотой акцент */
:root{--bg:#0f0f0e;--card:#171716;--ink:#efede8;--mut:#9c988f;--line:#2a2927;--gold:#a8905e;--r:14px}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Manrope,system-ui,sans-serif}
body{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
button,input,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:14px 16px;background:rgba(15,15,14,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .logo{height:18px;color:var(--ink)}
.back{border:0;background:none;padding:6px 8px 6px 0;color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
.lang{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:none;padding:6px 12px;font-size:12px;font-weight:700;color:var(--mut);cursor:pointer}
.lang button.on{background:var(--ink);color:var(--bg)}
.wrap{padding:0 16px}
.hero{padding:22px 0 8px}
.hero h1{font-weight:300;font-size:28px;line-height:1.15;margin:0 0 6px;letter-spacing:-.01em}
.hero p{margin:0;color:var(--mut);font-size:14px}
.hero i{display:block;width:40px;height:1.5px;background:var(--gold);margin:14px 0 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 16px 6px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:none;border-radius:999px;padding:8px 14px;font-size:13px;color:var(--mut);cursor:pointer;white-space:nowrap}
.chip.on{border-color:var(--ink);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px 0 8px}
.card{border:0;background:none;padding:0;text-align:left;cursor:pointer}
.ph{position:relative;aspect-ratio:4/5;border-radius:var(--r);background:var(--card);overflow:hidden;display:grid;place-items:center}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph svg{width:34%;opacity:.28}
.card b{display:block;font-weight:500;font-size:14px;margin:8px 2px 2px;line-height:1.3}
.card span{display:block;font-size:13px;color:var(--mut);margin:0 2px;white-space:nowrap}
.linkcard{display:flex;align-items:center;gap:12px;width:100%;margin:14px 0 24px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:none;text-align:left;cursor:pointer}
.linkcard div{flex:1}.linkcard b{display:block;font-weight:500}.linkcard span{font-size:13px;color:var(--mut)}
.linkcard em{font-style:normal;color:var(--gold);font-size:20px}
.pbig{aspect-ratio:1/1;border-radius:0;margin:0 -16px}
.pbig svg{width:24%}
h2{font-weight:400;font-size:24px;line-height:1.2;margin:18px 0 4px}
.price{font-size:18px;color:var(--ink);margin:0 0 12px;white-space:nowrap}
.desc{color:var(--mut);margin:0 0 18px}
.label{font-size:12px;color:var(--mut);margin:0 0 8px}
.sizes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.size{min-width:52px;height:44px;padding:0 14px;border:1px solid var(--line);background:none;border-radius:10px;cursor:pointer}
.size.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumb{flex:none;width:58px;height:58px;border-radius:10px;border:1.5px solid transparent;padding:0;overflow:hidden;background:var(--card);cursor:pointer}
.thumb.on{border-color:var(--ink)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.label b{color:var(--ink);font-weight:500}
.note{font-size:13px;color:var(--mut);display:flex;gap:8px;align-items:center}
.note i{width:6px;height:6px;border-radius:50%;background:var(--gold);flex:none}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.row .ph{aspect-ratio:1;border-radius:10px}
.row b{display:block;font-weight:500;font-size:14px;line-height:1.3}.row span{font-size:13px;color:var(--mut)}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px}
.qty button{width:36px;height:36px;border:0;background:none;font-size:18px;cursor:pointer}
.qty output{min-width:18px;text-align:center;font-size:14px}
.total{display:flex;justify-content:space-between;padding:16px 0;font-size:16px}
.total b{font-weight:700;white-space:nowrap}
.empty{text-align:center;color:var(--mut);padding:60px 0}
.field{display:block;margin:0 0 14px}
.field span{display:block;font-size:12px;color:var(--mut);margin:0 0 6px}
.field input,.field textarea{width:100%;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);outline:none}
.field input:focus,.field textarea:focus{border-color:var(--gold)}
.field textarea{min-height:76px;resize:vertical}
.field.bad input{border-color:#c4584b}
.warn{border:1px solid var(--gold);border-radius:12px;padding:12px 14px;font-size:14px;margin:16px 0}
.cta{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.cta button{width:100%;height:52px;border:0;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:700;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.cta button[disabled]{opacity:.35}
.cta button .n{background:var(--bg);color:var(--ink);border-radius:999px;font-size:12px;padding:2px 8px}
.cta[hidden]{display:none}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:500;opacity:0;transition:opacity .2s;pointer-events:none;z-index:7;white-space:nowrap}
.toast.on{opacity:1}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<header class="top">
 <button class="back" id="back" hidden aria-label="Назад">←</button>
 <svg class="logo" id="logo" viewBox="-4 -4 352 88" fill="none" stroke="currentColor" stroke-linecap="square" aria-label="MONARCH"></svg>
 <div class="lang" role="group" aria-label="Язык"><button data-l="ru">RU</button><button data-l="uz">UZ</button></div>
</header>
<main class="wrap" id="app"></main>
<div class="cta" id="cta" hidden><button id="ctaBtn"></button></div>
<div class="toast" id="toast"></div>
<script>
{
const tg = window.Telegram && window.Telegram.WebApp;
const inTg = !!(tg && tg.initData);
// sendData работает, только если магазин открыт кнопкой клавиатуры (тогда нет query_id)
const canSend = inTg && !(tg.initDataUnsafe && tg.initDataUnsafe.query_id);
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor('#0f0f0e'); tg.setBackgroundColor('#0f0f0e'); } catch (e) {} }

const I18N = {
 ru: {hero:'Вещи на заказ из Китая', heroSub:'Доставка 8–13 дней', all:'Все', linkT:'Нет нужной вещи?', linkS:'Закажите по ссылке: Poizon, Taobao, 1688',
  size:'Размер', color:'Цвет', one:'Один размер', pick:'Выберите размер', add:'В корзину', added:'Добавлено в корзину', deliv:'Доставка 8–13 дней из Китая',
  cart:'Корзина', empty:'Корзина пуста', toShop:'Перейти в каталог', total:'Итого', checkout:'Оформить', order:'Оформление', name:'Имя',
  phone:'Телефон', address:'Город и адрес', comment:'Комментарий (цвет, рост и вес)', confirm:'Подтвердить заказ',
  payNote:'После подтверждения бот пришлёт реквизиты для оплаты картой.', linkTitle:'Заказ по ссылке',
  link:'Ссылка на вещь', linkHint:'Poizon, Taobao, 1688, Pinduoduo…', sizeColor:'Размер и цвет', send:'Отправить заказ',
  linkNote:'Менеджер рассчитает цену и пришлёт сумму к оплате в бот.', open:'Чтобы оформить заказ, откройте магазин кнопкой «🛍 Магазин» внизу чата с ботом.',
  outside:'Это предпросмотр в браузере: в Telegram заказ уйдёт в бот.', fill:'Заполните отмеченные поля', cur:'сум', items:'шт.', loadErr:'Не удалось загрузить каталог. Попробуйте позже.'},
 uz: {hero:'Xitoydan buyurtma asosida kiyimlar', heroSub:'Yetkazib berish 8–13 kun', all:'Hammasi', linkT:'Kerakli narsa yo\'qmi?', linkS:'Havola orqali buyurtma bering: Poizon, Taobao, 1688',
  size:'O\'lcham', color:'Rang', one:'Bitta o\'lcham', pick:'O\'lchamni tanlang', add:'Savatga', added:'Savatga qo\'shildi', deliv:'Xitoydan 8–13 kunda yetkazib beramiz',
  cart:'Savat', empty:'Savat bo\'sh', toShop:'Katalogga o\'tish', total:'Jami', checkout:'Rasmiylashtirish', order:'Rasmiylashtirish', name:'Ism',
  phone:'Telefon', address:'Shahar va manzil', comment:'Izoh (rang, bo\'y va vazn)', confirm:'Buyurtmani tasdiqlash',
  payNote:'Tasdiqlaganingizdan so\'ng bot karta orqali to\'lov rekvizitlarini yuboradi.', linkTitle:'Havola orqali buyurtma',
  link:'Mahsulot havolasi', linkHint:'Poizon, Taobao, 1688, Pinduoduo…', sizeColor:'O\'lcham va rang', send:'Buyurtmani yuborish',
  linkNote:'Menejer narxni hisoblab, to\'lov summasini botga yuboradi.', open:'Buyurtma berish uchun do\'konni bot chatining pastidagi «🛍 Do\'kon» tugmasi orqali oching.',
  outside:'Bu brauzerdagi ko\'rinish: Telegramda buyurtma botga yuboriladi.', fill:'Belgilangan maydonlarni to\'ldiring', cur:'so\'m', items:'dona', loadErr:'Katalogni yuklab bo\'lmadi. Keyinroq urinib ko\'ring.'}
};
const store = {get(k,d){try{const v=localStorage.getItem('mn_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('mn_'+k,JSON.stringify(v))}catch(e){}}};
const urlLang = new URLSearchParams(location.search).get('lang');
let lang = ['ru','uz'].includes(urlLang) ? urlLang : store.get('lang', (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code === 'uz') ? 'uz' : 'ru');
const t = k => I18N[lang][k];
let CAT = null, view = 'shop', cat = 'all', pid = null, size = null, color = null, shot = null;
let cart = store.get('cart', []);            // [{id,size,qty}]
let form = store.get('form', {name:'',phone:'',address:'',comment:''});
let lform = {link:'', size:''};
const app = document.getElementById('app'), cta = document.getElementById('cta'), ctaBtn = document.getElementById('ctaBtn'), backBtn = document.getElementById('back');

// логотип: тот же, что в боте и на баннерах
const MARK='M12,66 V24 L27,44 L40,14 L53,44 L68,24 V66 M12,66 H68';
const WORD=['M0,40 V0 L15,26 L30,0 V40','M86,20 A20,20 0 1 1 46,20 A20,20 0 1 1 86,20','M102,40 V0 L132,40 V0','M148,40 L164,0 L180,40 M154,26 H174','M196,40 V0 H213 A10,10 0 0 1 213,20 H196 M210,21.5 L226,40','M276.1,5.9 A20,20 0 1 0 276.1,34.1','M292,40 V0 M320,40 V0 M292,20 H320'];
const markSvg = `<svg viewBox="0 0 80 80" fill="none" stroke="#efede8" stroke-width="3" stroke-linecap="square"><path d="${MARK}"/><g fill="#efede8" stroke="none"><circle cx="12" cy="15" r="3"/><circle cx="40" cy="5" r="3"/><circle cx="68" cy="15" r="3"/></g></svg>`;
document.getElementById('logo').innerHTML = `<g stroke-width="5"><path d="${MARK}"/></g><g fill="currentColor" stroke="none"><circle cx="12" cy="15" r="3.5"/><circle cx="40" cy="5" r="3.5"/><circle cx="68" cy="15" r="3.5"/></g><g transform="translate(104 22) scale(.75)" stroke-width="4.6">${WORD.map(d=>`<path d="${d}"/>`).join('')}</g>`;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = x => x.toLocaleString('ru-RU').replace(/ /g,' ') + ' ' + t('cur');
const L = (o, k) => (lang === 'uz' && o[k + '_uz']) || o[k] || '';
const P = id => CAT.products.find(p => p.id === id);
const sizeLabel = s => s === 'ONE' ? t('one') : s;
const colorOf = (p, cid) => (p.colors || []).find(c => c.id === cid);
const colorName = c => c ? (lang === 'uz' ? c.uz : c.ru) : '';
const cover = (p, cid) => (colorOf(p, cid) || (p.colors || [])[0] || {}).photo || p.photo || '';
const photo = (p, cls='', src) => { const s = src ?? cover(p); return `<div class="ph ${cls}">${s ? `<img src="${esc(s)}" alt="${esc(L(p,'title'))}" loading="lazy">` : markSvg}</div>`; };
const haptic = () => { try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {} };
const save = () => { store.set('cart', cart); store.set('form', form); };
const count = () => cart.reduce((a, i) => a + i.qty, 0);
const sum = () => cart.reduce((a, i) => { const p = P(i.id); return a + (p ? p.price * i.qty : 0); }, 0);
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('on'); clearTimeout(toast.h); toast.h=setTimeout(()=>el.classList.remove('on'),1400); }
function setCta(label, on, disabled=false){ cta.hidden=!on; ctaBtn.innerHTML=label; ctaBtn.disabled=disabled; }

function go(v, extra){ view = v; if (extra) { pid = extra.pid ?? pid; size = null; color = null; shot = null; } render(); window.scrollTo(0, 0); }
function render(){
 document.documentElement.lang = lang;
 document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
 const root = view === 'shop';
 backBtn.hidden = root;
 if (tg && tg.BackButton) { try { root ? tg.BackButton.hide() : tg.BackButton.show(); } catch (e) {} }
 if (!CAT) { app.innerHTML = `<p class="empty">…</p>`; setCta('', false); return; }
 ({shop: vShop, product: vProduct, cart: vCart, checkout: vCheckout, link: vLink})[view]();
}

function vShop(){
 const cats = [{id:'all', title:t('all')}, ...CAT.categories.map(c => ({id:c.id, title:L(c,'title')}))];
 const list = CAT.products.filter(p => cat === 'all' || p.cat === cat);
 app.innerHTML = `<section class="hero"><h1>${t('hero')}</h1><p>${t('heroSub')}</p><i></i></section>
  <nav class="chips">${cats.map(c => `<button class="chip ${c.id===cat?'on':''}" data-cat="${esc(c.id)}">${esc(c.title)}</button>`).join('')}</nav>
  <section class="grid">${list.map(p => `<button class="card" data-p="${esc(p.id)}">${photo(p)}<b>${esc(L(p,'title'))}</b><span>${money(p.price)}</span></button>`).join('')}</section>
  <button class="linkcard" data-go="link"><div><b>${t('linkT')}</b><span>${t('linkS')}</span></div><em>→</em></button>`;
 const n = count();
 setCta(`${t('cart')} <span class="n">${n}</span> · ${money(sum())}`, n > 0);
 ctaBtn.onclick = () => go('cart');
}
function vProduct(){
 const p = P(pid); if (!p) return go('shop');
 const colors = p.colors || [];
 if (!color && colors.length) color = colors[0].id;
 if (p.sizes.length === 1 && !size) size = p.sizes[0];
 const shots = [...colors.map(c => c.photo), ...(p.photos || [])];
 const big = shot || cover(p, color);
 app.innerHTML = `${photo(p,'pbig',big)}
  ${shots.length > 1 ? `<div class="thumbs">${shots.map(s => `<button class="thumb ${s===big?'on':''}" data-shot="${esc(s)}"><img src="${esc(s)}" alt="" loading="lazy"></button>`).join('')}</div>` : ''}
  <h2>${esc(L(p,'title'))}</h2><p class="price">${money(p.price)}</p><p class="desc">${esc(L(p,'description'))}</p>
  ${colors.length ? `<p class="label">${t('color')}: <b>${esc(colorName(colorOf(p, color)))}</b></p><div class="sizes">${colors.map(c => `<button class="size ${c.id===color?'on':''}" data-color="${esc(c.id)}">${esc(colorName(c))}</button>`).join('')}</div>` : ''}
  <p class="label">${t('size')}</p><div class="sizes">${p.sizes.map(s => `<button class="size ${s===size?'on':''}" data-size="${esc(s)}">${esc(sizeLabel(s))}</button>`).join('')}</div>
  <p class="note"><i></i>${t('deliv')}</p>`;
 setCta(size ? t('add') : t('pick'), true, !size);
 ctaBtn.onclick = () => {
  if (!size) return;
  const ex = cart.find(i => i.id === p.id && i.size === size && (i.color || null) === (color || null));
  ex ? ex.qty = Math.min(20, ex.qty + 1) : cart.push({id:p.id, size, color, qty:1});
  save(); haptic(); toast(t('added')); go('shop');
 };
}
function vCart(){
 cart = cart.filter(i => P(i.id));
 if (!cart.length) { app.innerHTML = `<h2>${t('cart')}</h2><p class="empty">${t('empty')}</p>`; setCta(t('toShop'), true); ctaBtn.onclick = () => go('shop'); return; }
 app.innerHTML = `<h2>${t('cart')}</h2>${cart.map((i, k) => { const p = P(i.id); const c = colorOf(p, i.color); return `<div class="row">${photo(p,'',cover(p, i.color))}<div><b>${esc(L(p,'title'))}</b><span>${c ? esc(colorName(c)) + ' · ' : ''}${esc(sizeLabel(i.size))} · ${money(p.price)}</span></div>
  <div class="qty"><button data-q="${k}" data-d="-1" aria-label="−">−</button><output>${i.qty}</output><button data-q="${k}" data-d="1" aria-label="+">+</button></div></div>`; }).join('')}
  <div class="total"><span>${t('total')}</span><b>${money(sum())}</b></div>`;
 setCta(`${t('checkout')} · ${money(sum())}`, true);
 ctaBtn.onclick = () => go('checkout');
}
const fieldsHtml = (extra='') => `${extra}
 <label class="field" data-f="name"><span>${t('name')}</span><input id="f_name" autocomplete="name" value="${esc(form.name)}"></label>
 <label class="field" data-f="phone"><span>${t('phone')}</span><input id="f_phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+998" value="${esc(form.phone)}"></label>
 <label class="field" data-f="address"><span>${t('address')}</span><input id="f_address" autocomplete="street-address" value="${esc(form.address)}"></label>
 <label class="field"><span>${t('comment')}</span><textarea id="f_comment">${esc(form.comment)}</textarea></label>`;
function readForm(){ for (const k of ['name','phone','address','comment']) form[k] = document.getElementById('f_'+k).value.trim(); save(); }
function validate(keys){
 let ok = true;
 keys.forEach(k => { const v = k === 'link' ? lform.link : k === 'lsize' ? lform.size : form[k];
  const bad = !v || (k === 'phone' && (v.match(/\d/g) || []).length < 9);
  const el = app.querySelector(`[data-f="${k}"]`); if (el) el.classList.toggle('bad', bad); if (bad) ok = false; });
 if (!ok) toast(t('fill'));
 return ok;
}
function submit(payload){
 const data = JSON.stringify(Object.assign({v:1, lang}, payload));
 if (canSend) { haptic(); tg.sendData(data); return true; }   // бот получит заказ, мини-апп закроется
 toast(inTg ? t('open') : t('outside'));
 return false;
}
const notice = () => canSend ? '' : `<div class="warn">${inTg ? t('open') : t('outside')}</div>`;
function vCheckout(){
 if (!cart.length) return go('cart');
 app.innerHTML = `<h2>${t('order')}</h2><p class="desc">${count()} ${t('items')} · ${money(sum())}</p>${notice()}${fieldsHtml()}<p class="note"><i></i>${t('payNote')}</p>`;
 setCta(t('confirm'), true);
 ctaBtn.onclick = () => {
  readForm(); if (!validate(['name','phone','address'])) return;
  const ok = submit({kind:'catalog', items:cart.map(i => ({id:i.id, size:i.size, color:i.color || null, qty:i.qty})),
   name:form.name.slice(0,64), phone:form.phone.slice(0,32), address:form.address.slice(0,200), comment:form.comment.slice(0,300)});
  if (ok) { cart = []; save(); }
 };
}
function vLink(){
 app.innerHTML = `<h2>${t('linkTitle')}</h2><p class="desc">${t('linkNote')}</p>${notice()}
  <label class="field" data-f="link"><span>${t('link')}</span><input id="l_link" type="url" inputmode="url" placeholder="${t('linkHint')}" value="${esc(lform.link)}"></label>
  <label class="field" data-f="lsize"><span>${t('sizeColor')}</span><input id="l_size" placeholder="L, ${lang==='uz'?'qora':'чёрный'}" value="${esc(lform.size)}"></label>
  ${fieldsHtml()}`;
 setCta(t('send'), true);
 ctaBtn.onclick = () => {
  lform.link = document.getElementById('l_link').value.trim(); lform.size = document.getElementById('l_size').value.trim(); readForm();
  if (!validate(['link','lsize','name','phone','address'])) return;
  submit({kind:'custom', link:lform.link.slice(0,500), size:lform.size.slice(0,100),
   name:form.name.slice(0,64), phone:form.phone.slice(0,32), address:form.address.slice(0,200), comment:form.comment.slice(0,300)});
 };
}

// события
app.addEventListener('click', ev => {
 const c = ev.target.closest('[data-cat]'); if (c) { cat = c.dataset.cat; return render(); }
 const p = ev.target.closest('[data-p]'); if (p) return go('product', {pid: p.dataset.p});
 const s = ev.target.closest('[data-size]'); if (s) { size = s.dataset.size; return render(); }
 const cl = ev.target.closest('[data-color]'); if (cl) { color = cl.dataset.color; shot = null; return render(); }
 const sh = ev.target.closest('[data-shot]'); if (sh) { shot = sh.dataset.shot; const p = P(pid); const c = (p.colors || []).find(x => x.photo === shot); if (c) color = c.id; return render(); }
 const q = ev.target.closest('[data-q]'); if (q) { const i = cart[+q.dataset.q]; i.qty += +q.dataset.d; if (i.qty < 1) cart.splice(+q.dataset.q, 1); if (i.qty > 20) i.qty = 20; save(); haptic(); return render(); }
 const g = ev.target.closest('[data-go]'); if (g) return go(g.dataset.go);
});
const goBack = () => go(view === 'checkout' ? 'cart' : 'shop');
backBtn.onclick = goBack;
if (tg && tg.BackButton) { try { tg.BackButton.onClick(goBack); } catch (e) {} }
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => {
 if (['checkout','link'].includes(view)) { try { readForm(); } catch (e) {} }
 lang = b.dataset.l; store.set('lang', lang); render();
});

fetch('catalog.json?v=' + Date.now()).then(r => r.json()).then(d => {
  // скрытые и товары без цены не показываем; пустые категории — тоже
  d.products = d.products.filter(p => !p.hidden && p.price > 0);
  d.categories = d.categories.filter(c => d.products.some(p => p.cat === c.id));
  CAT = d;
  cart = cart.filter(i => { const p = P(i.id); return p && p.sizes.includes(i.size) && (!p.colors || !p.colors.length || colorOf(p, i.color)); });
  save(); render(); })
 .catch(() => { app.innerHTML = `<p class="empty">${t('loadErr')}</p>`; });
render();
}
</script>
</body>
</html>
